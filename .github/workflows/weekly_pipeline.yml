name: Weekly EPL Simulation & Data Sync

on:
  schedule:
    # Runs at 02:00 AM UTC every Monday
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write # Grants write access to commit and push updated CSVs

jobs:
  sync-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Weekly Pipeline
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: |
          python src/run_weekly_pipeline.py

      - name: Commit & Push Updated Data CSVs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/processed/
          git diff --staged --quiet || git commit -m "auto: update 2026-27 standings and gameweek forecasts [skip ci]"
          git pull --rebase origin main
          git push