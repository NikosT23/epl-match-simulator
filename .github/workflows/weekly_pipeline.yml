name: Weekly EPL Simulation & Data Sync

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Weekly Pipeline
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          PYTHONPATH: .
        run: |
          python src/run_weekly_pipeline.py

      - name: Commit & Push Updated Data CSVs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update 2026-27 standings and gameweek forecasts [skip ci]"
          file_pattern: "data/processed/*.csv"